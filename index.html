<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover Windows apps and generate ready-to-run WinGet commands and scripts."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <script>
      ;(() => {
        const saved = localStorage.getItem('winget-web-ui-theme') || 'system'
        const dark =
          saved === 'dark' ||
          (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themePreference = saved
      })()
    </script>
    <title>WingetWebUI — Build your Windows setup</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
